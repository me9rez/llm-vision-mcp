<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">llm-vision-mcp — 给文本模型装上眼睛</title>
  <desc id="desc">MCP Server 把图片文件转成文字描述：image.png 经本地 llm-vision-mcp 交给 Qwen-VL 视觉模型，返回文字描述，让 DeepSeek 等文本模型也能看图。</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="360" rx="24" fill="url(#bgGrad)" stroke="#21262d" stroke-width="1.5"/>

  <!-- ============ 左侧：标题区 ============ -->
  <g id="title-block" transform="translate(56 0)">
    <text x="0" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" font-weight="600" letter-spacing="3" fill="#8b949e">MCP SERVER · NODE.JS</text>

    <text x="0" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="64" font-weight="700" fill="#e6edf3">llm-vision-mcp</text>

    <text x="0" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="30" font-weight="600" fill="#e6edf3">给文本模型装上眼睛</text>

    <text x="0" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="19" fill="#8b949e">Give text-only LLMs the ability to see</text>

    <text x="0" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#8b949e">OpenAI-compatible · local stdio · free Qwen-VL</text>
  </g>

  <!-- ============ 右侧：管线 ============ -->
  <g id="pipeline" transform="translate(700 0)">
    <text x="0" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" font-weight="600" letter-spacing="2" fill="#8b949e">PIPELINE</text>

    <!-- 卡 1：图片输入 -->
    <g id="card-input">
      <rect x="0" y="56" width="380" height="56" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
      <g transform="translate(16 68)">
        <rect width="24" height="24" rx="4" fill="none" stroke="#8b949e" stroke-width="1.5"/>
        <circle cx="8" cy="9" r="2.5" fill="none" stroke="#8b949e" stroke-width="1.5"/>
        <path d="M4 19 L10 13 L14 17 L18 12 L22 19" fill="none" stroke="#8b949e" stroke-width="1.5"/>
      </g>
      <text x="56" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" fill="#e6edf3">image.png</text>
      <text x="316" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="16" fill="#8b949e" text-anchor="end">INPUT</text>
    </g>

    <!-- 箭头 1 -->
    <g stroke="#58a6ff" stroke-width="2">
      <line x1="190" y1="112" x2="190" y2="130"/>
      <path d="M190 132 L186 124 L194 124 Z" fill="#58a6ff" stroke="none"/>
    </g>

    <!-- 卡 2：MCP 服务 -->
    <g id="card-mcp">
      <rect x="0" y="132" width="380" height="56" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
      <text x="16" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" fill="#e6edf3">llm-vision-mcp</text>
      <rect x="288" y="145" width="76" height="28" rx="14" fill="#1f6feb33" stroke="#58a6ff66" stroke-width="1"/>
      <text x="326" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="16" fill="#58a6ff" text-anchor="middle">Qwen-VL</text>
    </g>

    <!-- 箭头 2 -->
    <g stroke="#58a6ff" stroke-width="2">
      <line x1="190" y1="188" x2="190" y2="206"/>
      <path d="M190 208 L186 200 L194 200 Z" fill="#58a6ff" stroke="none"/>
    </g>

    <!-- 卡 3：文字输出 -->
    <g id="card-output">
      <rect x="0" y="208" width="380" height="56" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
      <text x="16" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="20" font-weight="600" fill="#e6edf3">文字描述</text>
      <text x="316" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="16" fill="#3fb950" text-anchor="end">OUTPUT</text>
    </g>

    <text x="0" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#8b949e">本地 stdio · 不开放任何网络端口</text>
  </g>

  <!-- ============ 底部：终端 ============ -->
  <g id="terminal">
    <rect x="56" y="312" width="1088" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
    <text x="80" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <tspan fill="#3fb950">$ </tspan>
      <tspan fill="#e6edf3">npx -y @me9rez/llm-vision-mcp analyze_image ./图.png</tspan>
    </text>
    <rect x="704" y="326" width="10" height="22" fill="#58a6ff" opacity="0.9"/>
  </g>
</svg>